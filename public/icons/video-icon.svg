<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 453 430" width="453" height="430" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="brown" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7A4327"/>
      <stop offset="1" stop-color="#4A2514"/>
    </linearGradient>
    <linearGradient id="orange" gradientUnits="userSpaceOnUse" x1="50" y1="190" x2="400" y2="345">
      <stop offset="0" stop-color="#FFB547"/>
      <stop offset="1" stop-color="#EE8A22"/>
    </linearGradient>
    <linearGradient id="play" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD180"/>
      <stop offset="1" stop-color="#F5A73B"/>
    </linearGradient>
    <linearGradient id="stripe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFBE55"/>
      <stop offset="1" stop-color="#F09A2A"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#C99A5B" flood-opacity="0.25"/>
    </filter>
    <clipPath id="clipUpper"><rect x="105" y="132" width="245" height="36" rx="7"/></clipPath>
    <clipPath id="clipLower"><rect x="155" y="170" width="195" height="32" rx="4"/></clipPath>
    <path id="ribR" d="M352,210 C398,206 412,246 394,286 C376,324 322,342 272,333"/>
    <path id="ribL" d="M140,312 C100,338 52,312 62,268"/>
  </defs>

  <!-- Background tile -->
  <rect x="18" y="16" width="417" height="396" rx="78" fill="#FDF4E4" stroke="#F1E3CB" stroke-width="2" filter="url(#soft)"/>
  <circle cx="245" cy="205" r="150" fill="#FBE9CF"/>

  <!-- Leaves -->
  <ellipse cx="80" cy="232" rx="14" ry="32" transform="rotate(-25 80 232)" fill="#F8DEB8"/>
  <ellipse cx="96" cy="270" rx="12" ry="26" transform="rotate(35 96 270)" fill="#F7D9AE"/>

  <!-- Left film strip (behind body) -->
  <use xlink:href="#ribL" fill="none" stroke="url(#orange)" stroke-width="40"/>
  <use xlink:href="#ribL" fill="none" stroke="#FFFFFF" stroke-width="32" stroke-dasharray="7 10" stroke-dashoffset="-6"/>
  <use xlink:href="#ribL" fill="none" stroke="url(#orange)" stroke-width="20"/>

  <!-- Clapper body -->
  <rect x="105" y="170" width="245" height="165" rx="14" fill="url(#brown)"/>

  <!-- Lower (fixed) bar -->
  <rect x="155" y="170" width="195" height="32" rx="4" fill="#5A2E1A"/>
  <g clip-path="url(#clipLower)" fill="url(#stripe)">
    <polygon points="176,170 206,170 190,202 160,202"/>
    <polygon points="241,170 271,170 255,202 225,202"/>
    <polygon points="306,170 336,170 320,202 290,202"/>
    <polygon points="371,170 401,170 385,202 355,202"/>
  </g>

  <!-- Upper (clapping) bar, tilted -->
  <g transform="rotate(-11 110 150)">
    <rect x="105" y="132" width="245" height="36" rx="7" fill="#5A2E1A"/>
    <g clip-path="url(#clipUpper)" fill="url(#stripe)">
      <polygon points="168,132 198,132 180,168 150,168"/>
      <polygon points="233,132 263,132 245,168 215,168"/>
      <polygon points="298,132 328,132 310,168 280,168"/>
      <polygon points="363,132 393,132 375,168 345,168"/>
    </g>
  </g>

  <!-- Hinge details -->
  <circle cx="124" cy="158" r="8" fill="#F5A73B"/>
  <circle cx="122" cy="186" r="5" fill="#8A5030"/>

  <!-- Play button -->
  <path d="M203,234 L203,298 L262,266 Z" fill="url(#play)" stroke="url(#play)" stroke-width="9" stroke-linejoin="round"/>

  <!-- Right film strip (in front) -->
  <use xlink:href="#ribR" fill="none" stroke="url(#orange)" stroke-width="40"/>
  <use xlink:href="#ribR" fill="none" stroke="#FFFFFF" stroke-width="32" stroke-dasharray="7 10" stroke-dashoffset="-6"/>
  <use xlink:href="#ribR" fill="none" stroke="url(#orange)" stroke-width="20"/>
</svg>
