<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 447 404" width="447" height="404" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FEF6E9"/>
      <stop offset="1" stop-color="#FCEBD3"/>
    </linearGradient>
    <linearGradient id="bgStroke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#F6DDBA" stop-opacity="0.6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F9DDB8" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#F9DDB8" stop-opacity="0.55"/>
    </radialGradient>
    <linearGradient id="cone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#FFF7EC"/>
      <stop offset="1" stop-color="#F6DFC2"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB21E"/>
      <stop offset="1" stop-color="#F27A0D"/>
    </linearGradient>
    <linearGradient id="inner" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C8500A"/>
      <stop offset="1" stop-color="#F0800F"/>
    </linearGradient>
    <linearGradient id="orangeBand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB324"/>
      <stop offset="1" stop-color="#F58A12"/>
    </linearGradient>
    <linearGradient id="brown" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9A5A32"/>
      <stop offset="1" stop-color="#5E301B"/>
    </linearGradient>
    <linearGradient id="knob" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC24A"/>
      <stop offset="1" stop-color="#F08A14"/>
    </linearGradient>
    <linearGradient id="ig" x1="0.1" y1="1" x2="0.9" y2="0">
      <stop offset="0" stop-color="#FFC947"/>
      <stop offset="0.35" stop-color="#F9573B"/>
      <stop offset="0.65" stop-color="#D8266F"/>
      <stop offset="1" stop-color="#7C3AC8"/>
    </linearGradient>
    <linearGradient id="fb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2F86F5"/>
      <stop offset="1" stop-color="#1B5FD1"/>
    </linearGradient>
    <linearGradient id="yt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2513F"/>
      <stop offset="1" stop-color="#E8352B"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6D9AE"/>
      <stop offset="1" stop-color="#F3CE9C"/>
    </linearGradient>
    <clipPath id="fbClip"><circle cx="358" cy="172" r="32"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#C87A1E" flood-opacity="0.25"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background rounded tile -->
  <rect x="18" y="14" width="410" height="376" rx="64" fill="url(#bg)" stroke="url(#bgStroke)" stroke-width="3"/>

  <!-- Big soft circle -->
  <circle cx="232" cy="212" r="150" fill="url(#glow)"/>

  <!-- Leaves -->
  <g fill="url(#leaf)" opacity="0.9">
    <!-- left pair -->
    <path d="M96 128 C118 140 128 165 112 192 C92 182 82 150 96 128 Z"/>
    <path d="M55 178 C76 176 92 190 92 208 C70 214 52 200 55 178 Z"/>
    <!-- bottom pair -->
    <path d="M198 268 C214 280 214 302 198 316 C184 302 184 282 198 268 Z" opacity="0.9"/>
    <path d="M232 296 C214 300 200 312 200 326 C220 328 236 316 232 296 Z"/>
    <path d="M170 300 C160 312 160 326 174 336 C186 322 184 308 170 300 Z"/>
  </g>

  <!-- Ground shadow under megaphone -->
  <ellipse cx="140" cy="340" rx="70" ry="9" fill="#E9B878" opacity="0.35"/>

  <!-- Sound rays -->
  <g stroke="#F9B235" stroke-width="9" stroke-linecap="round" fill="none">
    <path d="M257 126 L270 104"/>
    <path d="M279 158 L304 144"/>
    <path d="M288 188 L315 191"/>
    <path d="M296 222 L316 233"/>
  </g>

  <!-- MEGAPHONE -->
  <g transform="translate(240 199) rotate(-18)" filter="url(#shadow)">
    <!-- handle grip -->
    <path d="M-152 34 L-116 36 Q-111 32 -110 40 L-107 100 Q-106 112 -118 114 L-141 116 Q-153 116 -154 104 L-158 38 Z" fill="url(#brown)"/>
    <path d="M-148 42 L-140 43 L-142 106 L-148 106 Z" fill="#FFFFFF" opacity="0.14"/>
    <path d="M-154 96 L-107 96 Q-106 112 -118 114 L-141 116 Q-153 116 -154 104 Z" fill="#3E1E10" opacity="0.35"/>
    <!-- mouthpiece -->
    <path d="M-184 -33 Q-194 -33 -194 -18 L-194 18 Q-194 33 -184 33 L-154 36 L-154 -36 Z" fill="url(#brown)"/>
    <ellipse cx="-188" cy="0" rx="8" ry="33" fill="#4A2413"/>
    <path d="M-182 -22 L-160 -25 L-160 -18 L-182 -15 Z" fill="#FFFFFF" opacity="0.14"/>
    <!-- orange band -->
    <path d="M-156 -40 L-126 -40 L-126 40 L-156 40 Z" fill="url(#orangeBand)"/>
    <path d="M-156 -40 L-126 -40 L-126 -30 L-156 -30 Z" fill="#FFE29A" opacity="0.6"/>
    <!-- cone body -->
    <path d="M-126 -40 L-12 -79 L-12 79 L-126 40 Z" fill="url(#cone)"/>
    <path d="M-126 8 L-12 14 L-12 79 L-126 40 Z" fill="#EBC79A" opacity="0.4"/>
    <path d="M-120 -34 L-24 -67 L-24 -57 L-120 -24 Z" fill="#FFFFFF" opacity="0.7"/>
    <!-- rim outer -->
    <ellipse cx="0" cy="0" rx="33" ry="84" fill="url(#rim)"/>
    <!-- rim inner -->
    <ellipse cx="8" cy="0" rx="24" ry="71" fill="url(#inner)"/>
    <ellipse cx="15" cy="0" rx="14" ry="55" fill="#B23C08" opacity="0.35"/>
    <!-- knob -->
    <ellipse cx="15" cy="6" rx="14" ry="20" fill="url(#knob)"/>
    <ellipse cx="18" cy="-2" rx="5" ry="9" fill="#FFE2A0" opacity="0.65"/>
  </g>

  <!-- Instagram -->
  <g filter="url(#softShadow)">
    <circle cx="328" cy="99" r="36" fill="url(#ig)"/>
  </g>
  <g fill="none" stroke="#FFFFFF" stroke-width="4.5">
    <rect x="310" y="81" width="36" height="36" rx="11"/>
    <circle cx="328" cy="99" r="8.5"/>
  </g>
  <circle cx="339" cy="88" r="2.6" fill="#FFFFFF"/>

  <!-- Facebook -->
  <g filter="url(#softShadow)">
    <circle cx="358" cy="172" r="32" fill="url(#fb)"/>
  </g>
  <path clip-path="url(#fbClip)" fill="#FFFFFF" d="M352 204 L352 181 L344 181 L344 172 L352 172 L352 166 C352 157 357 152 366 152 C369 152 372 152.500 373 153 L373 162 L368 162 C364 162 364 164 364 166 L364 172 L372 172 L370 181 L364 181 L364 204 Z"/>

  <!-- YouTube -->
  <g filter="url(#softShadow)">
    <circle cx="334" cy="270" r="36" fill="url(#yt)"/>
  </g>
  <rect x="312" y="256" width="44" height="31" rx="9" fill="#FFFFFF"/>
  <path d="M328 264 L328 279 L342 271.500 Z" fill="#EC3A2E" stroke="#EC3A2E" stroke-width="2" stroke-linejoin="round"/>
</svg>
