<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 453 430" width="453" height="430" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="wandBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8A4B2B"/>
      <stop offset="0.55" stop-color="#5E2F1A"/>
      <stop offset="1" stop-color="#40200F"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFCB6B"/>
      <stop offset="1" stop-color="#E88A20"/>
    </linearGradient>
    <linearGradient id="cardInner" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC04D"/>
      <stop offset="1" stop-color="#EA7C17"/>
    </linearGradient>
    <linearGradient id="cardOuter" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF0CF"/>
      <stop offset="1" stop-color="#FCDDA6"/>
    </linearGradient>
    <linearGradient id="mount" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFEBC2"/>
      <stop offset="1" stop-color="#FBC466"/>
    </linearGradient>
    <radialGradient id="starFill" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.6" stop-color="#FFF6DC"/>
      <stop offset="1" stop-color="#FFE3A6"/>
    </radialGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#C99A5B" flood-opacity="0.25"/>
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#E08A2A" flood-opacity="0.35"/>
    </filter>
    <clipPath id="clipInner"><rect x="216" y="219" width="142" height="124" rx="14"/></clipPath>
  </defs>

  <!-- Background tile -->
  <rect x="18" y="16" width="417" height="396" rx="78" fill="#FDF4E4" stroke="#F1E3CB" stroke-width="2" filter="url(#soft)"/>
  <circle cx="240" cy="205" r="152" fill="#FBE9CF"/>

  <!-- Leaves -->
  <g fill="#F9DFB9">
    <path transform="translate(150,330) rotate(-30)" d="M0,0 C-17,-42 -17,-98 0,-140 C17,-98 17,-42 0,0Z"/>
    <path transform="translate(150,330) rotate(-65)" d="M0,0 C-14,-30 -14,-70 0,-100 C14,-70 14,-30 0,0Z"/>
  </g>
  <g fill="#F7D3A0">
    <path transform="translate(150,330) rotate(30)" d="M0,0 C-11,-18 -11,-42 0,-62 C11,-42 11,-18 0,0Z"/>
    <path transform="translate(150,332) rotate(98)" d="M0,0 C-10,-16 -10,-38 0,-56 C10,-38 10,-16 0,0Z"/>
    <path transform="translate(150,332) rotate(-95)" d="M0,0 C-10,-16 -10,-36 0,-52 C10,-36 10,-16 0,0Z"/>
  </g>

  <!-- Image card -->
  <g filter="url(#cardShadow)">
    <rect x="204" y="208" width="160" height="148" rx="24" fill="url(#cardOuter)"/>
  </g>
  <rect x="216" y="219" width="142" height="124" rx="14" fill="url(#cardInner)"/>
  <g clip-path="url(#clipInner)">
    <path d="M214,345 L214,338 L256,274 Q262,266 268,274 L298,318 L312,297 Q318,289 324,297 L360,340 L360,345 Z"
          fill="url(#mount)" stroke="url(#mount)" stroke-width="6" stroke-linejoin="round"/>
  </g>
  <circle cx="316" cy="252" r="14" fill="#FFE3A8"/>

  <!-- Magic wand -->
  <g transform="translate(75,325) rotate(-47.7)">
    <rect x="0" y="-13" width="176" height="26" rx="13" fill="url(#wandBody)"/>
    <rect x="12" y="-8" width="150" height="4" rx="2" fill="#FFFFFF" opacity="0.28"/>
    <rect x="172" y="-14.5" width="30" height="29" rx="3" fill="url(#gold)"/>
    <rect x="176" y="-11" width="3" height="22" rx="1.5" fill="#FFFFFF" opacity="0.35"/>
    <path d="M202,-13 L224,-3 Q228,0 224,3 L202,13 Z" fill="#5A2C17" stroke="#5A2C17" stroke-width="2" stroke-linejoin="round"/>
  </g>

  <!-- Main sparkle -->
  <path d="M247,86 Q261,124 299,138 Q261,152 247,190 Q233,152 195,138 Q233,124 247,86Z"
        fill="url(#starFill)" stroke="#F5A73B" stroke-width="9" stroke-linejoin="round"/>
  <path d="M247,112 Q252,132 272,138 Q252,144 247,164 Q242,144 222,138 Q242,132 247,112Z" fill="#FFFFFF"/>

  <!-- Small sparkles -->
  <g fill="#F59A2B" stroke="#F59A2B" stroke-linejoin="round" stroke-width="3">
    <path d="M318,77 Q321,94 338,97 Q321,100 318,117 Q315,100 298,97 Q315,94 318,77Z"/>
    <path d="M333,163 Q335,176 348,180 Q335,184 333,197 Q331,184 318,180 Q331,176 333,163Z"/>
    <path d="M178,95 Q179,102 187,105 Q179,108 178,115 Q177,108 169,105 Q177,102 178,95Z"/>
    <path d="M149,151 Q151,160 161,163 Q151,166 149,175 Q147,166 137,163 Q147,160 149,151Z"/>
  </g>
  <circle cx="335" cy="143" r="2.5" fill="#F7B968"/>
  <circle cx="287" cy="192" r="3" fill="#F7B968"/>
</svg>
