<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 429" width="448" height="429" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FEF6E9"/>
      <stop offset="1" stop-color="#FCEBD3"/>
    </linearGradient>
    <linearGradient id="bgStroke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#F6DDBA" stop-opacity="0.6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FBE3C1" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#F9DDB8" stop-opacity="0.6"/>
    </radialGradient>
    <linearGradient id="mic" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#8A4726"/>
      <stop offset="0.5" stop-color="#5E2E16"/>
      <stop offset="1" stop-color="#3F1D0E"/>
    </linearGradient>
    <linearGradient id="micHi" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C77A48" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#C77A48" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB627"/>
      <stop offset="1" stop-color="#F07A12"/>
    </linearGradient>
    <linearGradient id="orangeH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFB627"/>
      <stop offset="1" stop-color="#F58A1A"/>
    </linearGradient>
    <linearGradient id="holder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFA31F"/>
      <stop offset="1" stop-color="#F07A12"/>
    </linearGradient>
    <linearGradient id="stand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6E3819"/>
      <stop offset="1" stop-color="#3F1D0E"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8D6A2"/>
      <stop offset="1" stop-color="#F2C388"/>
    </linearGradient>
    <clipPath id="capClip"><rect x="175" y="90" width="98" height="166" rx="49"/></clipPath>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#5E2E16" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background tile -->
  <rect x="15" y="14" width="417" height="398" rx="66" fill="url(#bg)" stroke="url(#bgStroke)" stroke-width="3"/>

  <!-- Soft circle -->
  <circle cx="224" cy="200" r="150" fill="url(#glow)"/>

  <!-- Leaves -->
  <g fill="url(#leaf)">
    <!-- left -->
    <path d="M160 276 C182 296 182 326 162 346 C140 326 140 296 160 276 Z"/>
    <path d="M100 312 C130 306 156 322 160 346 C126 352 102 336 100 312 Z"/>
    <!-- right -->
    <path d="M290 278 C310 298 308 328 288 346 C268 326 270 298 290 278 Z"/>
    <path d="M346 308 C346 334 322 350 292 346 C294 322 318 306 346 308 Z"/>
  </g>

  <!-- ground shadow -->
  <ellipse cx="222" cy="356" rx="80" ry="8" fill="#E9B878" opacity="0.35"/>

  <!-- Sound waves left -->
  <g fill="url(#orange)">
    <rect x="55" y="188" width="14" height="44" rx="7"/>
    <rect x="80" y="163" width="14" height="92" rx="7"/>
    <rect x="106" y="139" width="14" height="136" rx="7"/>
    <rect x="131" y="168" width="14" height="70" rx="7"/>
  </g>
  <!-- Sound waves right -->
  <g fill="url(#orange)">
    <rect x="300" y="168" width="14" height="70" rx="7"/>
    <rect x="325" y="139" width="14" height="136" rx="7"/>
    <rect x="351" y="163" width="14" height="92" rx="7"/>
    <rect x="376" y="188" width="14" height="44" rx="7"/>
  </g>

  <!-- Stand (stem + base) -->
  <g filter="url(#shadow)">
    <rect x="217" y="255" width="16" height="72" rx="4" fill="url(#stand)"/>
    <path d="M185 326 Q170 328 168 340 Q168 352 182 352 L268 352 Q282 352 282 340 Q280 328 265 326 Z" fill="url(#stand)"/>
    <path d="M186 330 L264 330" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Holder U -->
  <path d="M158 199 L158 214 C158 246 188 266 224 266 C260 266 291 246 291 214 L291 199"
        fill="none" stroke="url(#holder)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Mic capsule -->
  <g filter="url(#shadow)">
    <rect x="175" y="90" width="98" height="166" rx="49" fill="url(#mic)"/>
  </g>
  <rect x="175" y="90" width="30" height="166" fill="url(#micHi)" clip-path="url(#capClip)"/>
  

  <!-- Mic grille bars -->
  <g fill="url(#orangeH)">
    <rect x="188" y="132" width="72" height="12" rx="6"/>
    <rect x="188" y="158" width="72" height="12" rx="6"/>
    <rect x="188" y="184" width="72" height="12" rx="6"/>
  </g>
</svg>
